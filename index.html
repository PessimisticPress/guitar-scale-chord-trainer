<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scale & Chords">
  <meta name="theme-color" content="#f5f6f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111319" media="(prefers-color-scheme: dark)">
  <title>Guitar Scale &amp; Chord Trainer</title>
  <style>
    :root{
      --bg:#f5f6f9;--panel:#ffffff;--panel-2:#f8f9fc;--text:#171922;--muted:#676b78;
      --border:#daddE6;--line:#c9ccd6;--accent:#334f9d;--accent-soft:#e9eefc;
      --chord:#df6b36;--chord-text:#fff;--route:#4963a8;--common:#087f78;
      --next:#d26432;--current:#9296a3;--landing:#7b3fa0;--shadow:0 7px 20px rgba(31,38,65,.06);
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg:#111319;--panel:#1b1e26;--panel-2:#222630;--text:#f4f5f8;--muted:#adb1bd;
        --border:#393e4b;--line:#454a57;--accent:#a9baff;--accent-soft:#2c3655;
        --chord:#ff9a68;--chord-text:#171922;--route:#9eb2ff;--common:#54c9bd;
        --next:#ff9a68;--current:#7f8492;--landing:#d49bf2;--shadow:none;
      }
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      padding:max(15px,env(safe-area-inset-top)) 10px max(28px,env(safe-area-inset-bottom));
    }
    button,select{font:inherit;-webkit-tap-highlight-color:transparent}
    button{
      appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);
      border-radius:12px;min-height:46px;padding:9px 10px;font-size:15px;font-weight:680;
    }
    button:active{transform:scale(.985)}
    button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .app{max-width:720px;margin:0 auto}
    header{margin:3px 3px 12px}
    h1{font-size:24px;line-height:1.16;letter-spacing:-.025em;margin:0 0 4px}
    .sub{font-size:14px;line-height:1.38;color:var(--muted);margin:0}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);margin-bottom:11px}
    .progression-panel{padding:13px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .section-title{font-size:15px;font-weight:780}
    .text-button{min-height:38px;padding:6px 10px;font-size:13px;background:var(--panel-2)}
    .progression{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
    .step-button{padding:8px 5px;line-height:1.12;min-width:0}
    .step-button .chord-name{display:block;font-size:18px;font-weight:800}
    .step-button .bars{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
    .step-button.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .step-button.active .bars{color:inherit;opacity:.8}
    .all-summary{margin-top:10px;padding:9px 10px;border-radius:11px;background:var(--panel-2);font-size:13px;line-height:1.45;color:var(--muted)}
    .all-summary strong{color:var(--text)}
    .editor{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
    .editor-row{display:grid;grid-template-columns:30px 1fr 1.15fr .78fr;gap:7px;align-items:end;margin-bottom:9px}
    .step-number{align-self:center;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
    label{font-size:12px;color:var(--muted);display:block}
    select{width:100%;margin-top:5px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:10px;min-height:43px;padding:7px 8px;font-size:15px}
    .view-button.active{background:var(--accent-soft);border-color:var(--accent)}
    .map-panel{padding:12px 6px 13px}
    .view-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 6px 11px}
    .map-head{padding:0 8px 8px}
    .eyebrow{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.055em}
    .map-title{font-size:20px;font-weight:820;letter-spacing:-.02em;margin-top:3px}
    .map-instruction{font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px}
    .board-shell{position:relative;width:100%;max-width:680px;margin:0 auto;padding-left:42px}
    .string-gutter{position:absolute;z-index:3;left:0;top:0;width:42px;height:222px;background:var(--panel);border-right:1px solid var(--border);box-shadow:5px 0 9px rgba(30,35,53,.07);pointer-events:none}
    .string-gutter span{position:absolute;right:5px;transform:translateY(-50%);font-size:9px;font-weight:650;color:var(--muted);white-space:nowrap}
    .fret-scroller{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;touch-action:pan-x pan-y}
    .fret-scroller::-webkit-scrollbar{display:none}
    svg{display:block;width:888px;height:222px;max-width:none;min-width:888px}
    .swipe-status{text-align:center;font-size:12px;color:var(--muted);line-height:1.3;margin:8px 8px 0}
    .swipe-status strong{color:var(--text);font-size:13px}
    .legend{display:flex;flex-wrap:wrap;gap:8px 13px;margin:10px 9px 0;font-size:12px;color:var(--muted)}
    .legend-item{display:flex;align-items:center;gap:6px}
    .swatch{width:15px;height:15px;border-radius:50%;display:inline-block;flex:0 0 auto}
    .swatch.pattern{background:var(--route)}
    .swatch.chord{background:var(--chord)}
    .swatch.root{background:transparent;border:2px solid var(--accent);box-shadow:0 0 0 2px var(--panel)}
    .swatch.both{background:var(--common)}
    .swatch.old{background:var(--current)}
    .swatch.new{background:transparent;border:2px solid var(--next)}
    .swatch.land{background:var(--common);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--landing)}
    .nav-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 7px 0}
    .analysis{padding:12px 13px}
    .analysis-title{font-size:15px;font-weight:800;margin-bottom:7px}
    .fact{font-size:14px;line-height:1.45;color:var(--muted);margin:4px 0}
    .fact strong{color:var(--text)}
    .hidden{display:none!important}
    .version{text-align:center;color:var(--muted);font-size:11px;margin:14px 0 0}
    @media (max-width:390px){
      .editor-row{grid-template-columns:25px 1fr 1fr .72fr;gap:5px}
      .editor-row select{font-size:14px;padding-left:5px;padding-right:3px}
      .board-shell{padding-left:39px}
      .string-gutter{width:39px}
    }
    @media (max-width:335px){
      .editor-row{grid-template-columns:24px 1fr 1fr}
      .bars-field{grid-column:2/4}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main class="app">
  <header>
    <h1>Guitar Scale &amp; Chord Trainer</h1>
    <p class="sub">See the pathway. Keep what works. Land on the next chord.</p>
  </header>

  <section class="panel progression-panel" aria-labelledby="progressionTitle">
    <div class="panel-head">
      <div id="progressionTitle" class="section-title">Your progression</div>
      <button id="editProgression" class="text-button" type="button" aria-expanded="false" aria-controls="progressionEditor">Edit</button>
    </div>
    <div id="progression" class="progression" role="group" aria-label="Progression steps"></div>
    <div id="allSummary" class="all-summary"></div>
    <div id="progressionEditor" class="editor hidden"></div>
  </section>

  <section class="panel map-panel" aria-labelledby="mapTitle">
    <div class="view-switch" role="group" aria-label="Map view">
      <button class="view-button active" type="button" data-view="current">Current pattern</button>
      <button class="view-button" type="button" data-view="transition">Transition</button>
    </div>
    <div class="map-head">
      <div id="mapEyebrow" class="eyebrow">Current chord</div>
      <div id="mapTitle" class="map-title">C major pentatonic · 3–2</div>
      <div id="mapInstruction" class="map-instruction">Tap any outlined root to align the pathway from there.</div>
    </div>
    <div class="board-shell">
      <div class="string-gutter" aria-hidden="true">
        <span style="top:25px">1st E</span><span style="top:55.8px">2nd B</span><span style="top:86.6px">3rd G</span>
        <span style="top:117.4px">4th D</span><span style="top:148.2px">5th A</span><span style="top:179px">6th E</span>
      </div>
      <div id="fretScroller" class="fret-scroller" aria-label="Scrollable guitar fretboard, frets 0 through 22">
        <svg id="fretboard" viewBox="0 0 888 222" role="img" aria-labelledby="boardTitle boardDescription">
          <title id="boardTitle">Chord-specific pentatonic pathway</title>
          <desc id="boardDescription">A horizontally scrollable guitar fretboard showing a diagonal pentatonic pathway.</desc>
          <g id="boardBackground"></g><g id="inlays"></g><g id="frets"></g><g id="strings"></g>
          <g id="routeLines"></g><g id="markers"></g><g id="labels"></g>
        </svg>
      </div>
    </div>
    <div class="swipe-status" aria-live="polite"><strong id="visibleFrets">Frets 3–11</strong> · Swipe the fretboard</div>
    <div id="legend" class="legend"></div>
    <div class="nav-row">
      <button id="previousChord" type="button">← Previous</button>
      <button id="nextChord" type="button">Next →</button>
    </div>
  </section>

  <section class="panel analysis" aria-live="polite">
    <div id="analysisTitle" class="analysis-title"></div>
    <div id="analysisBody"></div>
  </section>

  <p class="version">Candidate prototype v0.2.2</p>
</main>

<script>
(() => {
  "use strict";
  const SVG_NS="http://www.w3.org/2000/svg";
  const STORAGE_KEY="guitar-scale-chord-trainer-v0.2";
  const OPEN_PITCH=[4,9,2,7,11,4];
  const OPEN_ABS=[40,45,50,55,59,64];
  const STRING_LABELS=["6th E","5th A","4th D","3rd G","2nd B","1st E"];
  const ROOT_OPTIONS=["C","C♯/D♭","D","D♯/E♭","E","F","F♯/G♭","G","G♯/A♭","A","A♯/B♭","B"];
  const MIN_FRET=0,MAX_FRET=22,FRET_WIDTH=38,BOARD_LEFT=5,BOARD_TOP=25,BOARD_HEIGHT=154;
  const MAJOR_NAMES=[
    ["C","D","E","F","G","A","B"],["D♭","E♭","F","G♭","A♭","B♭","C"],
    ["D","E","F♯","G","A","B","C♯"],["E♭","F","G","A♭","B♭","C","D"],
    ["E","F♯","G♯","A","B","C♯","D♯"],["F","G","A","B♭","C","D","E"],
    ["F♯","G♯","A♯","B","C♯","D♯","E♯"],["G","A","B","C","D","E","F♯"],
    ["A♭","B♭","C","D♭","E♭","F","G"],["A","B","C♯","D","E","F♯","G♯"],
    ["B♭","C","D","E♭","F","G","A"],["B","C♯","D♯","E","F♯","G♯","A♯"]
  ];
  const MINOR_NAMES=[
    ["C","D","E♭","F","G","A♭","B♭"],["C♯","D♯","E","F♯","G♯","A","B"],
    ["D","E","F","G","A","B♭","C"],["E♭","F","G♭","A♭","B♭","C♭","D♭"],
    ["E","F♯","G","A","B","C","D"],["F","G","A♭","B♭","C","D♭","E♭"],
    ["F♯","G♯","A","B","C♯","D","E"],["G","A","B♭","C","D","E♭","F"],
    ["G♯","A♯","B","C♯","D♯","E","F♯"],["A","B","C","D","E","F","G"],
    ["B♭","C","D♭","E♭","F","G♭","A♭"],["B","C♯","D","E","F♯","G","A"]
  ];
  const MAJOR_INTERVALS=[0,2,4,5,7,9,11], MINOR_INTERVALS=[0,2,3,5,7,8,10];
  const PENT_INTERVALS={major:[0,2,4,7,9],minor:[0,3,5,7,10]};
  const CHORD_INTERVALS={major:[0,4,7],minor:[0,3,7]};

  const state={
    progression:[{root:0,quality:"major",bars:3},{root:4,quality:"minor",bars:1},{root:7,quality:"major",bars:1}],
    active:0,view:"current",viewportFret:3,anchors:[null,null,null]
  };

  const $=id=>document.getElementById(id);
  const el={
    progression:$("progression"),allSummary:$("allSummary"),editProgression:$("editProgression"),progressionEditor:$("progressionEditor"),
    mapEyebrow:$("mapEyebrow"),mapTitle:$("mapTitle"),mapInstruction:$("mapInstruction"),fretScroller:$("fretScroller"),visibleFrets:$("visibleFrets"),
    boardTitle:$("boardTitle"),boardDescription:$("boardDescription"),boardBackground:$("boardBackground"),inlays:$("inlays"),
    frets:$("frets"),strings:$("strings"),routeLines:$("routeLines"),markers:$("markers"),labels:$("labels"),legend:$("legend"),
    previousChord:$("previousChord"),nextChord:$("nextChord"),analysisTitle:$("analysisTitle"),analysisBody:$("analysisBody")
  };
  let initialScrollApplied=false,scrollSaveTimer=null,suppressAnchorClick=false,touchStart=null;

  function mod(n,m=12){return((n%m)+m)%m}
  function svg(tag,attrs={},text=""){
    const node=document.createElementNS(SVG_NS,tag);
    Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,String(value)));
    if(text!=="")node.textContent=text;
    return node;
  }
  function rootName(chord){return(chord.quality==="major"?MAJOR_NAMES:MINOR_NAMES)[chord.root][0]}
  function chordName(chord){return rootName(chord)+(chord.quality==="minor"?"m":"")}
  function scaleName(chord){return `${rootName(chord)} ${chord.quality} pentatonic`}
  function noteData(chord){
    const parentIntervals=chord.quality==="major"?MAJOR_INTERVALS:MINOR_INTERVALS;
    const names=(chord.quality==="major"?MAJOR_NAMES:MINOR_NAMES)[chord.root];
    return PENT_INTERVALS[chord.quality].map(interval=>{
      const parentIndex=parentIntervals.indexOf(interval);
      return{pitch:mod(chord.root+interval),interval,name:names[parentIndex]};
    });
  }
  function chordToneData(chord){
    const parentIntervals=chord.quality==="major"?MAJOR_INTERVALS:MINOR_INTERVALS;
    const names=(chord.quality==="major"?MAJOR_NAMES:MINOR_NAMES)[chord.root];
    return CHORD_INTERVALS[chord.quality].map(interval=>{
      const parentIndex=parentIntervals.indexOf(interval);
      return{pitch:mod(chord.root+interval),name:names[parentIndex]};
    });
  }
  function pitchAt(stringIndex,fret){return mod(OPEN_PITCH[stringIndex]+fret)}
  function pitchSet(items){return new Set(items.map(item=>item.pitch))}
  function intersection(sets){
    if(!sets.length)return new Set();
    return new Set([...sets[0]].filter(value=>sets.slice(1).every(set=>set.has(value))));
  }
  function difference(a,b){return new Set([...a].filter(value=>!b.has(value)))}
  function formatList(names){
    if(!names.length)return"none";
    if(names.length===1)return names[0];
    if(names.length===2)return `${names[0]} and ${names[1]}`;
    return `${names.slice(0,-1).join(", ")}, and ${names[names.length-1]}`;
  }
  function namePitches(pitches,contextChord){
    const contextual=new Map(noteData(contextChord).map(note=>[note.pitch,note.name]));
    chordToneData(contextChord).forEach(note=>contextual.set(note.pitch,note.name));
    return [...pitches].sort((a,b)=>mod(a-contextChord.root)-mod(b-contextChord.root)).map(pitch=>contextual.get(pitch)||ROOT_OPTIONS[pitch]);
  }

  function rootAnchors(chord){
    const anchors=[];
    for(let s=0;s<6;s++){
      for(let f=MIN_FRET;f<=MAX_FRET;f++){
        if(pitchAt(s,f)===chord.root)anchors.push({s,f});
      }
    }
    return anchors;
  }
  function sameAnchor(a,b){return Boolean(a&&b&&a.s===b.s&&a.f===b.f)}
  function buildPath(chord,anchor){
    if(!anchor)return[];
    const anchorAbs=OPEN_ABS[anchor.s]+anchor.f;
    const positions=[];
    for(let s=0;s<6;s++){
      const delta=s-anchor.s;
      const pair=Math.floor(delta/2);
      const even=mod(delta,2)===0;
      const offsets=chord.quality==="major"
        ?(even?[0,2,4]:[7,9])
        :(even?[-2,0]:[3,5,7]);
      offsets.forEach(offset=>{
        const absolute=anchorAbs+pair*12+offset;
        const fret=absolute-OPEN_ABS[s];
        if(fret>=MIN_FRET&&fret<=MAX_FRET){
          positions.push({s,f:fret,pitch:mod(absolute),absolute});
        }
      });
    }
    return positions.sort((a,b)=>a.absolute-b.absolute||a.s-b.s);
  }
  function chooseAnchor(chord){
    const anchors=rootAnchors(chord);
    const visibleEnd=Math.min(MAX_FRET,state.viewportFret+9);
    const center=(state.viewportFret+visibleEnd)/2;
    return anchors.sort((a,b)=>{
      const visibleA=buildPath(chord,a).filter(position=>position.f>=state.viewportFret&&position.f<=visibleEnd).length;
      const visibleB=buildPath(chord,b).filter(position=>position.f>=state.viewportFret&&position.f<=visibleEnd).length;
      if(visibleA!==visibleB)return visibleB-visibleA;
      const countDiff=buildPath(chord,b).length-buildPath(chord,a).length;if(countDiff)return countDiff;
      const stringDiff=a.s-b.s;
      if(stringDiff)return stringDiff;
      return Math.abs(a.f-center)-Math.abs(b.f-center);
    })[0]||null;
  }
  function activeAnchor(index){
    const chord=state.progression[index];
    const saved=state.anchors[index];
    const valid=saved&&rootAnchors(chord).some(anchor=>sameAnchor(anchor,saved));
    if(valid)return saved;
    state.anchors[index]=chooseAnchor(chord);
    return state.anchors[index];
  }
  function keyFor(position){return `${position.s}-${position.f}`}

  function load(){
    try{
      const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(!saved||typeof saved!=="object")return;
      if(Array.isArray(saved.progression)&&saved.progression.length===3){
        const valid=saved.progression.every(chord=>Number.isInteger(chord.root)&&chord.root>=0&&chord.root<12&&["major","minor"].includes(chord.quality)&&Number.isInteger(chord.bars)&&chord.bars>=1&&chord.bars<=8);
        if(valid)state.progression=saved.progression;
      }
      if(Number.isInteger(saved.active)&&saved.active>=0&&saved.active<3)state.active=saved.active;
      if(["current","transition"].includes(saved.view))state.view=saved.view;
      if(Number.isInteger(saved.viewportFret))state.viewportFret=Math.max(MIN_FRET,Math.min(MAX_FRET,saved.viewportFret));
      if(Array.isArray(saved.anchors)&&saved.anchors.length===3)state.anchors=saved.anchors;
    }catch(error){/* Safely retain defaults. */}
  }
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(error){}}

  function buildSelectOptions(select,options,value){
    select.innerHTML="";
    options.forEach(optionData=>{
      const option=document.createElement("option");
      option.value=String(optionData.value);option.textContent=optionData.label;select.appendChild(option);
    });
    select.value=String(value);
  }
  function buildEditors(){
    el.progressionEditor.innerHTML="";
    state.progression.forEach((chord,index)=>{
      const row=document.createElement("div");row.className="editor-row";
      const number=document.createElement("div");number.className="step-number";number.textContent=String(index+1);
      const rootLabel=document.createElement("label");rootLabel.textContent="Root";
      const rootSelect=document.createElement("select");rootSelect.setAttribute("aria-label",`Step ${index+1} root`);
      buildSelectOptions(rootSelect,ROOT_OPTIONS.map((label,value)=>({label,value})),chord.root);
      rootLabel.appendChild(rootSelect);
      const qualityLabel=document.createElement("label");qualityLabel.textContent="Quality";
      const qualitySelect=document.createElement("select");qualitySelect.setAttribute("aria-label",`Step ${index+1} quality`);
      buildSelectOptions(qualitySelect,[{label:"Major",value:"major"},{label:"Minor",value:"minor"}],chord.quality);
      qualityLabel.appendChild(qualitySelect);
      const barsLabel=document.createElement("label");barsLabel.className="bars-field";barsLabel.textContent="Bars";
      const barsSelect=document.createElement("select");barsSelect.setAttribute("aria-label",`Step ${index+1} bars`);
      buildSelectOptions(barsSelect,Array.from({length:8},(_,i)=>({label:String(i+1),value:i+1})),chord.bars);
      barsLabel.appendChild(barsSelect);
      rootSelect.addEventListener("change",()=>{chord.root=Number(rootSelect.value);state.anchors[index]=null;save();render()});
      qualitySelect.addEventListener("change",()=>{chord.quality=qualitySelect.value;state.anchors[index]=null;save();render()});
      barsSelect.addEventListener("change",()=>{chord.bars=Number(barsSelect.value);save();renderProgression();renderAnalysis()});
      row.append(number,rootLabel,qualityLabel,barsLabel);el.progressionEditor.appendChild(row);
    });
  }
  function renderProgression(){
    el.progression.innerHTML="";
    state.progression.forEach((chord,index)=>{
      const button=document.createElement("button");button.type="button";button.className="step-button"+(index===state.active?" active":"");
      button.setAttribute("aria-pressed",String(index===state.active));
      button.setAttribute("aria-label",`${chordName(chord)}, ${chord.bars} ${chord.bars===1?"bar":"bars"}`);
      const name=document.createElement("span");name.className="chord-name";name.textContent=chordName(chord);
      const bars=document.createElement("span");bars.className="bars";bars.textContent=`${chord.bars} ${chord.bars===1?"bar":"bars"}`;
      button.append(name,bars);button.addEventListener("click",()=>{state.active=index;save();render()});el.progression.appendChild(button);
    });
    const allScale=intersection(state.progression.map(chord=>pitchSet(noteData(chord))));
    const allChord=intersection(state.progression.map(chord=>pitchSet(chordToneData(chord))));
    const scaleNames=namePitches(allScale,state.progression[0]);
    const chordNames=namePitches(allChord,state.progression[0]);
    el.allSummary.innerHTML=`<strong>Across all three patterns:</strong> ${formatList(scaleNames)}<br><strong>Chord tones shared by all:</strong> ${formatList(chordNames)}`;
  }
  function drawBoardBase(){
    [el.boardBackground,el.inlays,el.frets,el.strings,el.routeLines,el.markers,el.labels].forEach(group=>group.innerHTML="");
    const left=BOARD_LEFT,right=BOARD_LEFT+(MAX_FRET-MIN_FRET+1)*FRET_WIDTH,top=BOARD_TOP,height=BOARD_HEIGHT,positions=MAX_FRET-MIN_FRET+1,width=right-left,column=FRET_WIDTH,gap=height/5;
    el.boardBackground.appendChild(svg("rect",{x:left,y:top,width,height,rx:8,fill:"var(--panel-2)",stroke:"var(--border)","stroke-width":1}));
    for(let boundary=0;boundary<=positions;boundary++){
      const x=left+boundary*column;const rightFret=MIN_FRET+boundary;const nut=rightFret===1;
      el.frets.appendChild(svg("line",{x1:x,x2:x,y1:top,y2:top+height,stroke:nut?"var(--text)":"var(--line)","stroke-width":nut?3.2:1.15}));
    }
    for(let s=0;s<6;s++){
      const y=top+(5-s)*gap;el.strings.appendChild(svg("line",{x1:left,x2:right,y1:y,y2:y,stroke:"var(--text)","stroke-width":1+(5-s)*.3,opacity:.86}));
    }
    [3,5,7,9,12,15,17,19,21].forEach(fret=>{
      const x=left+(fret-MIN_FRET+.5)*column;const ys=fret===12?[top+height*.36,top+height*.64]:[top+height/2];
      ys.forEach(y=>el.inlays.appendChild(svg("circle",{cx:x,cy:y,r:3,fill:"var(--muted)",opacity:.2})));
    });
    for(let fret=MIN_FRET;fret<=MAX_FRET;fret++){
      const x=left+(fret-MIN_FRET+.5)*column;el.labels.appendChild(svg("text",{x,y:204,"text-anchor":"middle","font-size":10,fill:"var(--muted)"},String(fret)));
    }
    return{xFor:fret=>left+(fret-MIN_FRET+.5)*column,yFor:s=>top+(5-s)*gap};
  }
  function pathPoints(path,geometry){return path.map(pos=>`${geometry.xFor(pos.f)},${geometry.yFor(pos.s)}`).join(" ")}
  function addMarker(position,geometry,style,label,extra={}){
    const x=geometry.xFor(position.f),y=geometry.yFor(position.s);const group=svg("g",{});
    if(extra.outer){group.appendChild(svg("circle",{cx:x,cy:y,r:extra.outer,fill:"var(--panel-2)",stroke:extra.outerColor||"var(--accent)","stroke-width":extra.outerWidth||1.8}))}
    group.appendChild(svg("circle",{cx:x,cy:y,r:style.r||8,fill:style.fill||"var(--panel)",stroke:style.stroke||"none","stroke-width":style.strokeWidth||0,opacity:style.opacity??1}));
    if(label)group.appendChild(svg("text",{x,y:y+2.8,"text-anchor":"middle","font-size":label.length>1?7.1:8.2,"font-weight":780,fill:style.text||"var(--text)","pointer-events":"none"},label));
    el.markers.appendChild(group);return group;
  }
  function makeAnchorInteractive(group,anchor,index){
    group.setAttribute("role","button");group.setAttribute("tabindex","0");group.setAttribute("aria-label",`Use ${chordName(state.progression[index])} root on ${STRING_LABELS[anchor.s]}, fret ${anchor.f}`);
    const choose=()=>{if(suppressAnchorClick)return;state.anchors[index]={s:anchor.s,f:anchor.f};save();render()};
    group.addEventListener("click",choose);group.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();choose()}});
  }
  function drawCurrent(){
    const chord=state.progression[state.active],anchor=activeAnchor(state.active),path=buildPath(chord,anchor),geometry=drawBoardBase();
    if(path.length>1)el.routeLines.appendChild(svg("polyline",{points:pathPoints(path,geometry),fill:"none",stroke:"var(--route)","stroke-width":2.1,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.62}));
    const tones=pitchSet(chordToneData(chord));const pathKeys=new Set(path.map(keyFor));const names=new Map(noteData(chord).map(note=>[note.pitch,note.name]));
    path.forEach(position=>{
      const isTone=tones.has(position.pitch);const isRoot=position.pitch===chord.root;
      addMarker(position,geometry,{r:isTone?8.7:7.6,fill:isTone?"var(--chord)":"var(--route)",stroke:isTone?"var(--panel)":"none",strokeWidth:isTone?1.4:0,text:isTone?"var(--chord-text)":"#fff"},names.get(position.pitch),isRoot?{outer:11.6,outerColor:"var(--accent)",outerWidth:1.8}:{});
    });
    rootAnchors(chord).forEach(root=>{
      const selected=sameAnchor(root,anchor);const onPath=pathKeys.has(keyFor(root));
      if(onPath&&selected){
        const x=geometry.xFor(root.f),y=geometry.yFor(root.s);el.markers.appendChild(svg("path",{d:`M ${x} ${y-15} l -3.5 -5 h 7 z`,fill:"var(--accent)"}));return;
      }
      if(onPath&&!selected){
        const x=geometry.xFor(root.f),y=geometry.yFor(root.s);const hit=svg("circle",{cx:x,cy:y,r:12.5,fill:"transparent",stroke:"var(--accent)","stroke-width":1.4,"stroke-dasharray":"2 2"});
        makeAnchorInteractive(hit,root,state.active);el.markers.appendChild(hit);return;
      }
      const group=addMarker(root,geometry,{r:8,fill:"var(--panel-2)",stroke:"var(--accent)",strokeWidth:1.8,text:"var(--accent)"},rootName(chord));
      makeAnchorInteractive(group,root,state.active);
    });
    el.mapEyebrow.textContent="Current chord";el.mapTitle.textContent=`${scaleName(chord)} · ${chord.quality==="major"?"3–2":"2–3"}`;
    el.mapInstruction.textContent="Tap any outlined root to align the pathway from there.";
    el.boardTitle.textContent=`${scaleName(chord)} pathway`;el.boardDescription.textContent=`A diagonal ${chord.quality==="major"?"3-2":"2-3"} pathway for ${chordName(chord)} on a scrollable fretboard from fret 0 through 22.`;
  }
  function drawTransition(){
    const currentIndex=state.active,nextIndex=(state.active+1)%3,current=state.progression[currentIndex],next=state.progression[nextIndex];
    const currentPath=buildPath(current,activeAnchor(currentIndex)),nextPath=buildPath(next,activeAnchor(nextIndex)),geometry=drawBoardBase();
    if(currentPath.length>1)el.routeLines.appendChild(svg("polyline",{points:pathPoints(currentPath,geometry),fill:"none",stroke:"var(--current)","stroke-width":1.8,"stroke-linecap":"round",opacity:.5}));
    if(nextPath.length>1)el.routeLines.appendChild(svg("polyline",{points:pathPoints(nextPath,geometry),fill:"none",stroke:"var(--next)","stroke-width":1.8,"stroke-dasharray":"4 3","stroke-linecap":"round",opacity:.7}));
    const currentMap=new Map(currentPath.map(position=>[keyFor(position),position])),nextMap=new Map(nextPath.map(position=>[keyFor(position),position]));
    const sharedTones=intersection([pitchSet(chordToneData(current)),pitchSet(chordToneData(next))]);
    const names=new Map([...noteData(current),...noteData(next)].map(note=>[note.pitch,note.name]));
    const keys=new Set([...currentMap.keys(),...nextMap.keys()]);
    keys.forEach(key=>{
      const oldPos=currentMap.get(key),newPos=nextMap.get(key),position=oldPos||newPos;const both=Boolean(oldPos&&newPos);const landing=sharedTones.has(position.pitch)&&(both||newPos);
      const style=both?{r:8.4,fill:"var(--common)",text:"#fff"}:oldPos?{r:7,fill:"var(--current)",text:"#fff",opacity:.72}:{r:7.7,fill:"var(--panel-2)",stroke:"var(--next)",strokeWidth:1.9,text:"var(--next)"};
      addMarker(position,geometry,style,names.get(position.pitch)||ROOT_OPTIONS[position.pitch],landing?{outer:11.6,outerColor:"var(--landing)",outerWidth:1.8}:{});
    });
    el.mapEyebrow.textContent="Transition";el.mapTitle.textContent=`${chordName(current)} → ${chordName(next)}${nextIndex===0?" · loop":""}`;
    el.mapInstruction.textContent="Solid teal positions are already present in both selected pathways.";
    el.boardTitle.textContent=`Transition from ${chordName(current)} to ${chordName(next)}`;el.boardDescription.textContent=`An overlay comparing the selected ${chordName(current)} and ${chordName(next)} pentatonic pathways.`;
  }
  function renderLegend(){
    const items=state.view==="current"?[["pattern","Pattern note"],["chord","Chord tone"],["root","Root anchor"]]:[["both","Same position"],["old","Current only"],["new","Next only"],["land","Shared chord tone"]];
    el.legend.innerHTML="";items.forEach(([type,label])=>{const item=document.createElement("span");item.className="legend-item";const swatch=document.createElement("span");swatch.className=`swatch ${type}`;item.append(swatch,document.createTextNode(label));el.legend.appendChild(item)});
  }
  function renderAnalysis(){
    const current=state.progression[state.active],next=state.progression[(state.active+1)%3];
    if(state.view==="current"){
      el.analysisTitle.textContent=`Inside ${chordName(current)}`;
      const scaleNames=noteData(current).map(note=>note.name),toneNames=chordToneData(current).map(note=>note.name);
      el.analysisBody.innerHTML=`<p class="fact"><strong>Pattern notes:</strong> ${scaleNames.join(" · ")}</p><p class="fact"><strong>Chord tones:</strong> ${toneNames.join(" · ")}</p><p class="fact">Start from any outlined ${rootName(current)} and follow the connected route. The orange notes are your strongest chord targets.</p>`;
      return;
    }
    const currentScale=pitchSet(noteData(current)),nextScale=pitchSet(noteData(next));
    const common=intersection([currentScale,nextScale]),sharedTones=intersection([pitchSet(chordToneData(current)),pitchSet(chordToneData(next))]);
    const leaving=difference(currentScale,nextScale),entering=difference(nextScale,currentScale);
    const suffix=(state.active+1)%3===0?" as the progression loops":"";
    el.analysisTitle.textContent=`Moving from ${chordName(current)} to ${chordName(next)}${suffix}`;
    el.analysisBody.innerHTML=`<p class="fact"><strong>Works in both patterns:</strong> ${formatList(namePitches(common,current))}</p><p class="fact"><strong>Strong landing notes:</strong> ${formatList(namePitches(sharedTones,next))}</p><p class="fact"><strong>Pattern change:</strong> ${formatList(namePitches(leaving,current))} leaves; ${formatList(namePitches(entering,next))} enters.</p>`;
  }
  function visibleFretCount(){return Math.max(1,Math.floor((el.fretScroller.clientWidth||342)/FRET_WIDTH))}
  function maximumStart(){return Math.max(MIN_FRET,MAX_FRET-visibleFretCount()+1)}
  function updateVisibleFrets(){
    const first=Math.max(MIN_FRET,Math.min(maximumStart(),Math.round(el.fretScroller.scrollLeft/FRET_WIDTH)));
    const last=Math.min(MAX_FRET,first+visibleFretCount()-1);
    state.viewportFret=first;el.visibleFrets.textContent=`Frets ${first}–${last}`;
  }
  function scrollToFret(fret,smooth=true){
    const target=Math.max(MIN_FRET,Math.min(maximumStart(),fret));
    if(typeof el.fretScroller.scrollTo==="function")el.fretScroller.scrollTo({left:target*FRET_WIDTH,behavior:smooth?"smooth":"auto"});
    else el.fretScroller.scrollLeft=target*FRET_WIDTH;
    state.viewportFret=target;updateVisibleFrets();
  }
  function render(){
    renderProgression();buildEditors();
    document.querySelectorAll(".view-button").forEach(button=>button.classList.toggle("active",button.dataset.view===state.view));
    if(state.view==="current")drawCurrent();else drawTransition();
    renderLegend();renderAnalysis();
    el.previousChord.textContent=`← ${chordName(state.progression[(state.active+2)%3])}`;
    el.nextChord.textContent=`${chordName(state.progression[(state.active+1)%3])} →`;
    if(!initialScrollApplied){initialScrollApplied=true;requestAnimationFrame(()=>scrollToFret(state.viewportFret,false))}
    else updateVisibleFrets();
  }

  el.editProgression.addEventListener("click",()=>{
    const expanded=el.editProgression.getAttribute("aria-expanded")==="true";el.editProgression.setAttribute("aria-expanded",String(!expanded));
    el.progressionEditor.classList.toggle("hidden",expanded);el.editProgression.textContent=expanded?"Edit":"Done";
  });
  document.querySelectorAll(".view-button").forEach(button=>button.addEventListener("click",()=>{state.view=button.dataset.view;save();render()}));
  el.fretScroller.addEventListener("scroll",()=>{updateVisibleFrets();clearTimeout(scrollSaveTimer);scrollSaveTimer=setTimeout(save,180)},{passive:true});
  el.fretScroller.addEventListener("touchstart",event=>{const touch=event.touches[0];touchStart=touch?{x:touch.clientX,y:touch.clientY}:null;suppressAnchorClick=false},{passive:true});
  el.fretScroller.addEventListener("touchmove",event=>{if(!touchStart)return;const touch=event.touches[0];if(touch&&(Math.abs(touch.clientX-touchStart.x)>8||Math.abs(touch.clientY-touchStart.y)>8))suppressAnchorClick=true},{passive:true});
  el.fretScroller.addEventListener("touchend",()=>{touchStart=null;if(suppressAnchorClick)setTimeout(()=>{suppressAnchorClick=false},140)},{passive:true});
  el.previousChord.addEventListener("click",()=>{state.active=(state.active+2)%3;save();render()});
  el.nextChord.addEventListener("click",()=>{state.active=(state.active+1)%3;save();render()});

  load();render();
})();
</script>
</body>
